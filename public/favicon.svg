<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#10141A"/>
  <!-- weft: data rows (primary teal) -->
  <g stroke="#15ADC1" stroke-width="3.5" stroke-linecap="round">
    <line x1="6.5" y1="10" x2="25.5" y2="10"/>
    <line x1="6.5" y1="16" x2="25.5" y2="16"/>
    <line x1="6.5" y1="22" x2="25.5" y2="22"/>
  </g>
  <!-- warp: columns, passing over the rows by default -->
  <g stroke-linecap="round">
    <line x1="12" y1="6.5" x2="12" y2="25.5" stroke="#10141A" stroke-width="5.5"/>
    <line x1="20" y1="6.5" x2="20" y2="25.5" stroke="#10141A" stroke-width="5.5"/>
    <line x1="12" y1="6.5" x2="12" y2="25.5" stroke="#EEF3F5" stroke-width="3.5"/>
    <line x1="20" y1="6.5" x2="20" y2="25.5" stroke="#EEF3F5" stroke-width="3.5"/>
  </g>
  <!-- rows passing over columns, alternating to form the weave -->
  <g stroke="#10141A" stroke-width="5.5">
    <line x1="10.25" y1="10" x2="13.75" y2="10"/>
    <line x1="18.25" y1="16" x2="21.75" y2="16"/>
    <line x1="10.25" y1="22" x2="13.75" y2="22"/>
  </g>
  <g stroke="#15ADC1" stroke-width="3.5">
    <line x1="8.5" y1="10" x2="15.5" y2="10"/>
    <line x1="16.5" y1="16" x2="23.5" y2="16"/>
    <line x1="8.5" y1="22" x2="15.5" y2="22"/>
  </g>
</svg>
